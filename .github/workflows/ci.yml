name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
      - run: zig fmt --check .
      - run: zig build
      - run: zig build test
